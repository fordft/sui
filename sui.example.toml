# sui configuration — copy to sui.toml in your project dir,
# or ~/.config/sui/config.toml for global defaults.
# Precedence: CLI flags > env vars > project sui.toml > global config > defaults.

[provider]
# Any OpenAI-compatible endpoint:
#   OpenAI      https://api.openai.com/v1
#   DeepSeek    https://api.deepseek.com/v1
#   OpenRouter  https://openrouter.ai/api/v1
#   vLLM/SGLang http://localhost:8000/v1
#   Ollama      http://localhost:11434/v1
base_url = "https://api.openai.com/v1"

# API key. Prefer env var SUI_API_KEY or OPENAI_API_KEY over committing this.
# api_key = "sk-..."

# Model name passed verbatim to the endpoint.
model = "gpt-5"

# Requested in the request body for providers that support cache accounting
# (OpenAI prompt_cache_key). Harmless on providers that ignore it.
# prompt_cache_key = "sui"

[agent]
# Hard cap on tool-call iterations per user turn. Don't let the loop spiral.
max_turns = 60

# Per-request deadline for the provider call.
request_timeout_ms = 300000

# Conservative context guard (estimated tokens, chars/4). Above this the
# turn stops cleanly instead of growing until the provider rejects it.
context_token_budget = 120000

# Default bash timeout; the model may request less, never more than bash_timeout_max.
bash_timeout_ms = 120000
bash_timeout_max_ms = 600000

# Auto-approve all tool calls (same as -y flag). Default false = y/n/a prompt.
# NEVER bypasses the endpoint trust gate.
# auto_approve = false

# Reserved completion capacity counted against the context budget.
# context_reserve_tokens = 8192

# ── Named provider profiles (GLOBAL config only — ~/.config/sui/config.toml) ──
# Profiles are ignored if defined in a project sui.toml.
# Credentials bind to the profile's endpoint; key comes from key_env.
#
# [profiles.cheap]
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# key_env = "DEEPSEEK_API_KEY"
# pricing = { input = 0.28, cached = 0.028, output = 0.42 }   # $/MTok
#
# [profiles.strong]
# base_url = "https://api.openai.com/v1"
# model = "gpt-5"
# key_env = "OPENAI_API_KEY"
#
# Certify with: sui-certify --profile cheap --profile strong

# ChatGPT-sign-in profile: uses your `codex login` session (or
# `sui auth codex`) to call the Codex backend — no API key, no base_url.
# This is subscription access, not API billing: token usage is reported
# but cost stays unknown. Runs the Responses API, not chat-completions.
#
# [profiles.codex]
# kind = "codex-oauth"
# model = "gpt-5.5"

# ── External coding agents (GLOBAL config only — ~/.config/sui/config.toml) ──
# ACP backends for mission roles — NOT provider URLs. Each entry is a
# trusted executable Sui may spawn (`devin acp`, the Codex ACP adapter).
# Sui never installs agents and refuses to run one until you set
# approved = true after verifying the command yourself.
# Authentication belongs to the agent's own CLI (devin login / codex
# auth) — Sui injects no credentials. The child starts with an EMPTY
# environment plus a safe whitelist; env_allow adds names, and anything
# key/token/secret-shaped is refused anyway.
#
# [agents.devin]
# command = "devin"
# args = ["acp"]            # devin acp speaks ACP over stdio
# model = "devin-…"         # optional; applied via session config option
# approved = true
#
# [agents.codex]
# command = "npx"
# args = ["-y", "@agentclientprotocol/codex-acp@1.11.0"]  # pinned, not @latest
# approved = true
#
# Select per mission role:
#   CLI: sui-mission --control-profile strong --worker-agent devin
#   TUI: Settings → role → acp:devin

# ── Web research (GLOBAL config only — ~/.config/sui/config.toml) ──
# First-class web_search / web_fetch for native agents, backed by Exa's
# hosted MCP service. Anonymous access works but is rate-limited; an
# optional API key raises usage. Queries and requested URLs leave this
# machine — the access policy below is INDEPENDENT of tool auto-approve
# (YOLO never turns web access on). [web] in a project sui.toml is
# ignored: project files may not raise network egress.
#
# [web]
# access = "ask"           # "off" (default) | "ask" | "auto"
# api_key = "exa-…"        # optional; prefer key_env or the Settings key entry
# key_env = "EXA_API_KEY"  # env var holding the key (headless path)
# endpoint = "https://mcp.exa.ai/mcp"
#
# Headless overrides: SUI_WEB_ACCESS=ask|auto, SUI_EXA_API_KEY=…
