[package]
name = "sui"
version = "0.3.0"
edition = "2021"
description = "cache-first multi-agent coding harness"
repository = "https://github.com/fordft/sui"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[[bin]]
name = "sui-certify"
path = "src/bin/certify.rs"

[[bin]]
name = "sui-mission"
path = "src/bin/mission.rs"

[workspace]

[profile.release]
lto = true
codegen-units = 1

# cargo-dist release pipeline: tag v* → CI build → GitHub Release assets
# (archives + checksums + sui-installer.sh). Private install dir keeps us
# off other `sui` binaries (e.g. the Mysten toolchain).
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = ["github"]
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
install-path = "$HOME/.sui/bin"
github-attestations = true
pr-run-mode = "plan"
allow-dirty = ["ci"]
