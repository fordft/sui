[package]
name = "sui"
version = "0.1.0"
edition = "2021"
description = "cache-first multi-agent coding harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[[bin]]
name = "sui-certify"
path = "src/bin/certify.rs"

[[bin]]
name = "sui-mission"
path = "src/bin/mission.rs"

[profile.release]
lto = true
codegen-units = 1
